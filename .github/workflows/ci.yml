name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo fmt --manifest-path backend/Cargo.toml --all -- --check
      - run: cargo test --manifest-path backend/Cargo.toml --locked
      - run: cargo clippy --manifest-path backend/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo audit --file backend/Cargo.lock

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          version: 11.25.0
          runtime: node@22
          working-directory: web
          install: false
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web test
      - run: pnpm --dir web build
      - run: pnpm --dir web audit --prod

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y busybox-static dash shellcheck
      - run: for file in scripts/install.sh scripts/uninstall.sh scripts/S99nfqws2-ui tests/installer-preflight.sh tests/busybox-symlink-move.sh; do dash -n "$file"; done
      - run: shellcheck -s sh scripts/install.sh scripts/uninstall.sh scripts/S99nfqws2-ui tests/installer-preflight.sh tests/busybox-symlink-move.sh
      - run: sh tests/installer-preflight.sh
      - run: sh tests/busybox-symlink-move.sh
