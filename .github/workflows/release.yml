name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: pnpm/setup@v3
        with:
          version: 11.25.0
          runtime: node@22
          working-directory: web
          install: false
      - uses: taiki-e/install-action@cross
      - uses: taiki-e/install-action@cargo-audit
      - name: Verify source and build web UI
        run: |
          sudo apt-get update
          sudo apt-get install -y busybox-static dash shellcheck
          for file in scripts/install.sh scripts/uninstall.sh scripts/S99nfqws2-ui scripts/symlink.sh tests/installer-preflight.sh tests/busybox-symlink-move.sh; do dash -n "$file"; done
          shellcheck -x -s sh scripts/install.sh scripts/uninstall.sh scripts/S99nfqws2-ui scripts/symlink.sh tests/installer-preflight.sh tests/busybox-symlink-move.sh
          sh tests/installer-preflight.sh
          sh tests/busybox-symlink-move.sh
          cargo fmt --manifest-path backend/Cargo.toml --all -- --check
          cargo test --manifest-path backend/Cargo.toml --locked
          cargo clippy --manifest-path backend/Cargo.toml --all-targets --locked -- -D warnings
          cargo audit --file backend/Cargo.lock
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web test
          pnpm --dir web build
          pnpm --dir web audit --prod
      - name: Cross-build router binary
        run: |
          cross test --manifest-path backend/Cargo.toml --target aarch64-unknown-linux-musl --locked
          cross build --manifest-path backend/Cargo.toml --release --target aarch64-unknown-linux-musl --locked
      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' backend/Cargo.toml | head -n 1)"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          [[ "$VERSION" =~ ^[A-Za-z0-9._+-]+$ ]]
          PACKAGE="$RUNNER_TEMP/nfqws2-ui-package"
          ASSET="nfqws2-ui-v${VERSION}-aarch64-unknown-linux-musl.tar.gz"
          mkdir -p "$PACKAGE/bin" "$PACKAGE/public" "$PACKAGE/scripts"
          install -m 755 "backend/target/aarch64-unknown-linux-musl/release/nfqws2-ui" "$PACKAGE/bin/nfqws2-ui"
          cp -R web/dist/. "$PACKAGE/public/"
          install -m 755 scripts/S99nfqws2-ui "$PACKAGE/scripts/S99nfqws2-ui"
          install -m 644 scripts/symlink.sh "$PACKAGE/scripts/symlink.sh"
          install -m 755 scripts/uninstall.sh "$PACKAGE/uninstall.sh"
          # Replace only the assignment; a global replacement also rewrites the
          # installer's unresolved-placeholder guard and rejects every version.
          sed "s/^VERSION='@VERSION@'$/VERSION='${VERSION}'/" scripts/install.sh > "$PACKAGE/install.sh"
          chmod 755 "$PACKAGE/install.sh"
          grep -Fxq "VERSION='${VERSION}'" "$PACKAGE/install.sh"
          grep -Fq "case \"\$VERSION\" in ''|*@VERSION@*|*[!A-Za-z0-9._+-]*)" "$PACKAGE/install.sh"
          # Exercise the exact rendered installer through its preflight path. It
          # must pass the version guard and stop at the intentionally mocked
          # missing sha256sum before making any package-manager changes.
          sh tests/installer-preflight.sh "$PACKAGE/install.sh"
          tar -C "$PACKAGE" -czf "$RUNNER_TEMP/$ASSET" bin public scripts uninstall.sh
          cd "$RUNNER_TEMP"
          sha256sum "$ASSET" > "$ASSET.sha256"
          cp "$PACKAGE/install.sh" "$RUNNER_TEMP/install.sh"
          readelf -h "$PACKAGE/bin/nfqws2-ui" | grep -q 'Machine:.*AArch64'
          ! readelf -l "$PACKAGE/bin/nfqws2-ui" | grep -q 'INTERP'
          shellcheck -s sh "$PACKAGE/install.sh"
          tar -tzf "$RUNNER_TEMP/$ASSET" > "$RUNNER_TEMP/archive-entries.txt"
          grep -Fxq 'bin/nfqws2-ui' "$RUNNER_TEMP/archive-entries.txt"
          grep -Fxq 'public/index.html' "$RUNNER_TEMP/archive-entries.txt"
          grep -Fxq 'scripts/S99nfqws2-ui' "$RUNNER_TEMP/archive-entries.txt"
          grep -Fxq 'scripts/symlink.sh' "$RUNNER_TEMP/archive-entries.txt"
          grep -Fxq 'uninstall.sh' "$RUNNER_TEMP/archive-entries.txt"
          (cd "$RUNNER_TEMP" && sha256sum -c "$ASSET.sha256")
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: nfqws2-ui-release-dry-run-${{ github.sha }}
          path: |
            ${{ runner.temp }}/install.sh
            ${{ runner.temp }}/nfqws2-ui-v*-aarch64-unknown-linux-musl.tar.gz
            ${{ runner.temp }}/nfqws2-ui-v*-aarch64-unknown-linux-musl.tar.gz.sha256
          if-no-files-found: error
      - uses: softprops/action-gh-release@v3
        if: github.event_name == 'push'
        with:
          name: nfqws2-ui ${{ github.ref_name }}
          generate_release_notes: false
          make_latest: true
          body: |
            Выпуск nfqws2-ui для ARM64 Entware.

            - TypeScript/React-интерфейс и Rust backend.
            - Проверка nfqws2 через штатный init-скрипт и PID/argv; управление start/stop/restart.
            - Конфигурация с резервным копированием, проверкой revision и применением через штатный restart/start.
            - Русский, английский, китайский и турецкий языки; светлая и тёмная темы.
            - Установщик проверяет SHA-256, порт/health-check и возвращает предыдущую версию при неудачном обновлении.
            - Подстановка версии в установщик проверяется на опубликованном артефакте; исправлена ошибка, из-за которой установщик отклонял собственную версию.

            Установка или обновление:

            ```sh
            wget -qO- https://github.com/rangerxxyy/nfqws2-ui/releases/latest/download/install.sh | sh
            ```

            Ограничение проверки: автоматические тесты и ARM64 cross-build проходят, однако установку и управление службой на физическом Keenetic пока не удалось проверить из-за отказа SSH-аутентификации в тестовой среде. Перед доступом извне ограничьте панель firewall роутера.
          files: |
            ${{ runner.temp }}/install.sh
            ${{ runner.temp }}/nfqws2-ui-v*-aarch64-unknown-linux-musl.tar.gz
            ${{ runner.temp }}/nfqws2-ui-v*-aarch64-unknown-linux-musl.tar.gz.sha256
