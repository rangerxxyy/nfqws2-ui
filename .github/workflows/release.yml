name: Release

on:
  push:
    tags: ['v*']
    branches: ['release/v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: pnpm/setup@v3
        with:
          version: 11.25.0
          runtime: node@22
          working-directory: web
          install: false
      - uses: taiki-e/install-action@cross
      - uses: taiki-e/install-action@cargo-audit
      - id: release-meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' backend/Cargo.toml | head -n 1)"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Verify source and build web UI
        run: |
          sudo apt-get update
          sudo apt-get install -y busybox-static dash shellcheck
          for file in scripts/install.sh scripts/uninstall.sh scripts/S99nfqws2-ui scripts/symlink.sh scripts/update-release.sh scripts/update-core-release.sh tests/installer-preflight.sh tests/busybox-symlink-move.sh tests/update-helper-preflight.sh; do dash -n "$file"; done
          shellcheck -x -s sh scripts/install.sh scripts/uninstall.sh scripts/S99nfqws2-ui scripts/symlink.sh scripts/update-release.sh scripts/update-core-release.sh tests/installer-preflight.sh tests/busybox-symlink-move.sh tests/update-helper-preflight.sh
          sh tests/installer-preflight.sh
          sh tests/busybox-symlink-move.sh
          sh tests/update-helper-preflight.sh
          cargo fmt --manifest-path backend/Cargo.toml --all -- --check
          cargo test --manifest-path backend/Cargo.toml --locked
          cargo clippy --manifest-path backend/Cargo.toml --all-targets --locked -- -D warnings
          cargo audit --file backend/Cargo.lock
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web test
          pnpm --dir web build
          test -f web/dist/nfqws2-ui.js
          test -f web/dist/nfqws2-ui.css
          test ! -e web/dist/index.html
          ! grep -Fq 'process.env.NODE_ENV' web/dist/nfqws2-ui.js
          pnpm --dir web audit --prod
      - name: Cross-build router binary
        run: |
          cross test --manifest-path backend/Cargo.toml --target aarch64-unknown-linux-musl --locked
          cross build --manifest-path backend/Cargo.toml --release --target aarch64-unknown-linux-musl --locked
      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$GITHUB_REF_TYPE" != "tag" ]]; then
            VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' backend/Cargo.toml | head -n 1)"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          [[ "$VERSION" =~ ^[A-Za-z0-9._+-]+$ ]]
          PACKAGE="$RUNNER_TEMP/nfqws2-ui-package"
          ASSET="nfqws2-ui-v${VERSION}-aarch64-unknown-linux-musl.tar.gz"
          mkdir -p "$PACKAGE/bin" "$PACKAGE/public" "$PACKAGE/scripts"
          install -m 755 "backend/target/aarch64-unknown-linux-musl/release/nfqws2-ui" "$PACKAGE/bin/nfqws2-ui"
          cp -R web/dist/. "$PACKAGE/public/"
          install -m 755 scripts/S99nfqws2-ui "$PACKAGE/scripts/S99nfqws2-ui"
          install -m 644 scripts/symlink.sh "$PACKAGE/scripts/symlink.sh"
          install -m 755 scripts/update-release.sh "$PACKAGE/scripts/update-release.sh"
          install -m 755 scripts/update-core-release.sh "$PACKAGE/scripts/update-core-release.sh"
          install -m 755 scripts/uninstall.sh "$PACKAGE/uninstall.sh"
          install -m 644 THIRD_PARTY_NOTICES.md "$PACKAGE/THIRD_PARTY_NOTICES.md"
          # Replace only the assignment; a global replacement also rewrites the
          # installer's unresolved-placeholder guard and rejects every version.
          sed "s/^VERSION='@VERSION@'$/VERSION='${VERSION}'/" scripts/install.sh > "$PACKAGE/install.sh"
          chmod 755 "$PACKAGE/install.sh"
          grep -Fxq "VERSION='${VERSION}'" "$PACKAGE/install.sh"
          grep -Fq "case \"\$VERSION\" in ''|*@VERSION@*|*[!A-Za-z0-9._+-]*)" "$PACKAGE/install.sh"
          # Exercise the exact rendered installer through its preflight path. It
          # must pass the version guard and stop at the intentionally mocked
          # missing sha256sum before making any package-manager changes.
          sh tests/installer-preflight.sh "$PACKAGE/install.sh"
          tar -C "$PACKAGE" -czf "$RUNNER_TEMP/$ASSET" bin public scripts uninstall.sh THIRD_PARTY_NOTICES.md
          cd "$RUNNER_TEMP"
          sha256sum "$ASSET" > "$ASSET.sha256"
          cp "$PACKAGE/install.sh" "$RUNNER_TEMP/install.sh"
          readelf -h "$PACKAGE/bin/nfqws2-ui" | grep -q 'Machine:.*AArch64'
          ! readelf -l "$PACKAGE/bin/nfqws2-ui" | grep -q 'INTERP'
          shellcheck -s sh "$PACKAGE/install.sh"
          tar -tzf "$RUNNER_TEMP/$ASSET" > "$RUNNER_TEMP/archive-entries.txt"
          grep -Fxq 'bin/nfqws2-ui' "$RUNNER_TEMP/archive-entries.txt"
          grep -Fxq 'public/nfqws2-ui.js' "$RUNNER_TEMP/archive-entries.txt"
          grep -Fxq 'public/nfqws2-ui.css' "$RUNNER_TEMP/archive-entries.txt"
          ! grep -Fxq 'public/index.html' "$RUNNER_TEMP/archive-entries.txt"
          grep -Fxq 'scripts/S99nfqws2-ui' "$RUNNER_TEMP/archive-entries.txt"
          grep -Fxq 'scripts/symlink.sh' "$RUNNER_TEMP/archive-entries.txt"
          grep -Fxq 'scripts/update-release.sh' "$RUNNER_TEMP/archive-entries.txt"
          grep -Fxq 'scripts/update-core-release.sh' "$RUNNER_TEMP/archive-entries.txt"
          grep -Fxq 'uninstall.sh' "$RUNNER_TEMP/archive-entries.txt"
          grep -Fxq 'THIRD_PARTY_NOTICES.md' "$RUNNER_TEMP/archive-entries.txt"
          (cd "$RUNNER_TEMP" && sha256sum -c "$ASSET.sha256")
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: nfqws2-ui-release-dry-run-${{ github.sha }}
          path: |
            ${{ runner.temp }}/install.sh
            ${{ runner.temp }}/nfqws2-ui-v*-aarch64-unknown-linux-musl.tar.gz
            ${{ runner.temp }}/nfqws2-ui-v*-aarch64-unknown-linux-musl.tar.gz.sha256
          if-no-files-found: error
      - uses: softprops/action-gh-release@v3
        if: github.event_name == 'push'
        with:
          tag_name: v${{ steps.release-meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: nfqws2-ui v${{ steps.release-meta.outputs.version }}
          generate_release_notes: false
          make_latest: true
          body: |
            nfqws2-ui ${{ github.ref_name }} для ARM64 Entware.

            ## Что изменилось в 0.5.3

            - Telegram показывает диагностику curl и HTTP вместо общей ошибки при проблемах сети; токен бота и адрес прокси маскируются.
            - Завершённый автоподбор восстанавливается после обновления панели без повторного уведомления.
            - Автоподбор проверяет стратегии и после прямого HTTP-ответа, включая 301.
            - Поле мониторинга отключает автозаполнение адреса, похожего на email; из боковой панели удалены фиктивные сведения о провайдере, службах и устройстве.

            ## Что изменилось в 0.5.2

            - Список сайтов, расписание и история до 96 проверок сохраняются backend на роутере; автоматические интервалы: 30 мин, 1 ч, 2 ч или пользовательский.
            - Telegram уведомляет о смене доступности сайта; добавлены проверочное сообщение, обнаружение ID чата и маршруты direct/interface/proxy.
            - Настройки мониторинга и Telegram разделены на отдельные панели.

            ## Что изменилось в 0.5.1

            - Исправлена перерисовка вкладок пользовательских `.list` файлов, а вместо крестика удаления отображается красная корзина.
            - В режиме «Своя стратегия» пользовательские варианты проверяются первыми; шаги варианта можно вставить вместе, несколько вариантов разделяются через `--new`.
            - Выпадающие списки получили более выразительную синюю подложку, подсказки кнопок появляются через две секунды.
            - Кнопка остановки использует квадрат остановки; кнопки обновления смещены влево.
            - Уведомление об обновлении оформлено компактной карточкой внизу справа; сообщение о том, что панель уже актуальна, убрано.

            ## Что изменилось в 0.5.0

            - Мониторинг проверяет DNS, TCP, TLS, HTTP и передачу тела HTTPS-ответа до 64 КиБ; соединение закрепляется за найденным публичным IPv4, перенаправления отключены.
            - Тайм-аут после HTTP-ответа показывается как возможное прерывание передачи, без ложного утверждения о доказанной блокировке; выполняется только безопасный GET без POST.
            - Проверка до 20 сайтов запускается параллельно, а подробности каждого этапа и последние 10 результатов сохраняются в браузере.
            - Добавлено безопасное удаление пользовательских `.list` файлов; штатные списки удалить нельзя.
            - Добавлены тематическая favicon, короткое название панели, подсказки действий в стиле UI и уведомление о доступном обновлении внизу справа.

            ## Что изменилось в 0.4.2

            - Вкладки пользовательских `.list` файлов читают и редактируют списки из `/lists`.
            - Редакторы групп конфигурации показывают нумерацию и до десяти видимых строк; короткие значения остаются компактными.
            - Выпадающие списки оформлены в стиле панели, подсказки кнопок появляются после трёх секунд наведения или фокуса.
            - Раздел «Мониторинг» последовательно проверяет вручную добавленные сайты и хранит последние результаты в браузере.

            ## Что изменилось в 0.4.1

            - В разделе «Конфигурация» добавлена вкладка «Скрипты» для чтения шести разрешённых Lua-модулей из обнаруженной установки; поддерживаются `.lua` и `.lua.gz`, а предпросмотр ограничен 512 КиБ.
            - В редакторах групп `NFQWS_*_ARGS` появились номера строк и компактная высота до десяти строк для длинных значений; добавлена боковая структура переменных полного конфига.
            - Удалена повторяющаяся сводка профилей и runtime-аргументов из настроек конфигурации.
            - Исправлено объединение шагов профиля с одинаковым `strategy=N` и удалён служебный тег стратегии из тестируемого кандидата.

            ## Что изменилось в 0.4.0

            - Многострочные значения всех семи групп `NFQWS_*` в настройках отображаются целиком и без внешних кавычек.
            - Стратегии из работающего профиля с `strategy=1`, `strategy=2` и другими номерами показываются автоподбору отдельными вариантами; связанные шаги одной стратегии остаются вместе.

            ## Что изменилось в 0.3.8

            - Постоянное уведомление о новой версии UI теперь показывается внизу слева в отдельной области; обычные сообщения интерфейса остались справа.

            ## Что изменилось в 0.3.7

            - Ручная проверка списка версий UI сразу обновляет статус фонового уведомления и синюю обводку кнопки.
            - При доступной версии появляется уведомление; если версия последняя, интерфейс сообщает установленный номер вместо молчаливого ответа.
            - В «Настройки конфигурации» добавлены отдельные редакторы семи групп параметров `NFQWS_*_ARGS`; значение каждой группы редактируется как черновик и проходит штатную проверку перед применением.
            - Подтверждённая для введённого домена стратегия доступна к применению после трёх успешных проверок, даже если исходная диагностика не смогла классифицировать обрыв.
            - Исправлена проверка кандидата перед применением: в `nfqws2 --dry-run` передаётся номер очереди `--qnum` работающего процесса.

            ## Что изменилось в 0.3.6

            - Кнопка «Применить к сайту» доступна сразу после 3/3 успешных проверок стратегии на введённом домене; полный обход сетей может продолжаться.
            - Перед изменением профиля работающий тест безопасно приостанавливается на границе текущей пробы, проверяет конфигурацию и применяет стратегию только к этому домену. После применения сканирование продолжается.
            - В подробностях результата указывается прогресс перебора, например «Стратегий проверено: 4 из 24». Размер каталога соответствует установленным возможностям nfqws2.
            - Совпадения стратегии в той же AS не применяются автоматически к введённому домену.
            - Раздел конфигурации открывает полный `nfqws.conf`; быстрые параметры, профили, активные аргументы и справочник флагов собраны во вкладке «Настройки конфигурации».

            ## Что изменилось в 0.3.5

            - Фоновая проверка версии панели выполняется сразу после старта сервиса и затем каждые четыре часа. Проверка ограничена стабильными релизами с ARM64-пакетом и SHA-256; при ошибке GitHub повторяется через 15 минут.
            - Когда доступна новая версия UI, кнопка панели выделяется синей обводкой, а внизу справа появляется постоянное уведомление с кнопкой открытия штатного обновления и ссылкой на GitHub.
            - Уведомление можно закрыть: оно не повторяется для этого тега в текущем браузере. Новый тег снова будет показан.
            - Обновление остается явным действием через существующую проверку checksum, health-check и откат; автоматической установки нет.

            ## Что изменилось в 0.3.4

            - Тайм-аут transfer-запроса теперь помечается красным как «Возможный обрыв» и запускает перебор fake-SNI после базовых проверок. Тайм-аут не объявляется доказанным обрывом на 16–20 КБ или DPI; DNS, connect и TLS ошибки остаются отдельными причинами.
            - Пошаговый прогресс диагностики показывает номер пункта, сеть, IP/ASN, этапы прямого запроса и текущего маршрута, а также отдельный этап подбора с правилом подтверждения 3/3.
            - Полный HTTP/TLS-каталог проверяется изолированными пакетами до трёх кандидатов с разными fwmark и диапазонами исходных портов. Найденные в пакете кандидаты перепроверяются последовательно; если безопасная изоляция недоступна, применяется последовательный fallback.
            - В строке пользовательского домена подтверждённую стратегию можно проверить и применить одним действием; backend перепроверяет revision и dry-run, сохраняет backup и откатывает изменение при сбое перезапуска.
            - Сохранены прошлые улучшения 0.3.3: повторные проверки кандидатов в одном изолированном процессе, честная отмена частичных проверок и компактные раскрываемые детали таблицы.

            ## Изменения 0.3.2

            - Ускорен обычный проход проверки 16 КБ: нормальные ответы проверяются одним прямым и одним маршрутным запросом. Второй запрос запускается только для тайм-аута около 16–20 КБ, чтобы проверить повторяемость.
            - Для стандартного каталога из 20 сетей это убирает до 40 HTTP-трансферов при нормальных ответах; подозрение на граничный обрыв по-прежнему требует двух согласующихся замеров.
            - Одиночный тайм-аут до тела ответа отображается как тайм-аут и не запускает поиск fake-SNI.
            - ASN определяется параллельно с проверками соединения, а не перед ними.
            - Адреса и результаты появляются в таблице по мере проверки каждой сети. В трассировке IP и прямой результат показываются до завершения debug-этапа.
            - Для fake-SNI кандидатов сохранены три последовательных успеха и трёхсекундная пауза после первой неудачи.

            ## Автоподбор стратегий HTTP/HTTPS

            - Доступны быстрый, расширенный и полный режимы. Полный режим строит совместимый каталог: дополнительные IP TTL, fake/SNI и split-варианты, hostfakesplit, fakedsplit/fakeddisorder, sequence overlap и повторные tcpseg.
            - Прямой запрос выполняется отдельно как базовая диагностика; HTTP-ответ, включая перенаправление, не отменяет проверку кандидатов.
            - Кандидаты фильтруются по Lua-функциям и blob-файлам установленного nfqws2, затем проверяются реальными запросами через отдельный временный процесс.
            - Поддерживаются настраиваемые повторы, сохранённый прогресс, история и отмена. Подтверждённые результаты из конфигурации, истории, диагностики 16 КБ и каталога сообщества перепроверяются на целевом домене.

            ## Диагностика передачи около 16 КБ

            - Один раздел сравнивает ограниченные HTTPS-проверки reference-сетей и пользовательских доменов напрямую и через текущий маршрут.
            - Результаты содержат домен или путь, IP, доступный ASN, полученный объём и повторяемость.
            - Пользовательские домены проверяются GET-запросами; проверка отправки тела ограничена четырьмя фиксированными статическими файлами reference-каталога.
            - Повторяемый тайм-аут около 16–20 КБ обозначается как возможное прерывание передачи, а не как установленная причина.
            - Строки результата подсвечиваются по исходу: красный — подтверждённый обрыв без найденного варианта, зелёный — чистая проверка или локально подтверждённая стратегия, янтарный — непроверенное совпадение по ASN.
            - Для стратегии с тремя успехами на введённом домене доступен предпросмотр и ручное применение прямо из теста. Перед записью выполняется `nfqws2 --dry-run`; профиль ограничен доменом, создаётся резервная копия, перезапуск защищён откатом при ошибке службы. Сетевые стратегии по ASN не применяются ко всему диапазону автоматически.

            ## Ограничения и проверка

            Пакетный режим ограничен тремя кандидатами за запуск и применяется только для HTTP/TLS; быстрые и расширенные стратегии остаются последовательными. Полный перебор может занять продолжительное время. Найденный в 16-КБ сканировании SNI-кандидат принимается после трёх успешных запросов. После применения стратегия не перепроверяется автоматически сетевым запросом; перед записью выполняется конфигурационный dry-run и перезапуск с откатом при ошибке. Результат тайм-аута означает возможную сетевую проблему и сам по себе не устанавливает её причину. Панель следует использовать в локальной сети.

            Установка или обновление:

            ```sh
            wget -qO- https://github.com/rangerxxyy/nfqws2-ui/releases/latest/download/install.sh | sh
            ```

            Пакет собран статически для aarch64-unknown-linux-musl.

          files: |
            ${{ runner.temp }}/install.sh
            ${{ runner.temp }}/nfqws2-ui-v*-aarch64-unknown-linux-musl.tar.gz
            ${{ runner.temp }}/nfqws2-ui-v*-aarch64-unknown-linux-musl.tar.gz.sha256
