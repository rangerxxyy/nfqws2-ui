[package]
name = "nfqws2-ui"
version = "1.11.4"
edition = "2024"
license = "MIT"

[lib]
name = "nfqws2_ui"
path = "src/lib.rs"

[[bin]]
name = "nfqws2-ui"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["json"] }
futures-util = "0.3"
argon2 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "process", "time"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
subtle = "2.6"
hex = "0.4"
libc = "0.2"
flate2 = "1.1.10"
tar = "0.4"
getrandom = "0.4.3"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
